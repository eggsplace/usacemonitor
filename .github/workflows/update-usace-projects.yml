name: Update USACE Civil Works and MILCON Cache

on:
  schedule:
    - cron: '0 6 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  refresh-usace-data:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Fetch Civil Works and MILCON Data
        run: node scripts/fetch-usace-data.js

      - name: Commit Updated Data Cache
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add data/civil-works-cache.json data/milcon-cache.json
          git diff --staged --quiet || (git commit -m "Auto-refresh USACE Civil Works & MILCON datasets [skip ci]" && git push)
