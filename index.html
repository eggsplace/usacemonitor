<!DOCTYPE html>

<style>
:root {
  --bg-base: #0a0c10;
  --bg-panel: rgba(14, 18, 24, 0.92);
  --border: #1e2638;
  --accent-cyan: #00f0ff;
  --accent-red: #ff3344;
  --accent-amber: #ffaa00;
  --accent-green: #00ff66;
  --text-main: #c0caf5;
  --text-dim: #565f89;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
body {
  background-color: var(--bg-base);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

header {
  background: #05070a;
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  z-index: 1000;
}
.brand { display: flex; align-items: center; gap: 10px; }
.status-badge {
  background: rgba(0, 255, 102, 0.15);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  padding: 2px 6px;
  font-size: 10px;
  border-radius: 2px;

}
.top-controls { display: flex; align-items: center; gap: 15px; }
.top-controls a.admin-link {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 11px;
  border: 1px solid var(--border);
  padding: 3px 8px;
}
.top-controls a.admin-link:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

.ticker-bar {
  background: rgba(255, 51, 68, 0.1);
  border-bottom: 1px solid rgba(255, 51, 68, 0.3);
  color: #ff8899;
  font-size: 12px;
  padding: 4px 12px;
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
}
.ticker-bar span.label { color: var(--accent-red); font-weight: bold; margin-right: 12px; }

.workspace { flex: 1; display: flex; position: relative; height: calc(100vh - 65px); }
#map { flex: 1; height: 100%; background: #000; }

aside {
  width: 300px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 999;
  backdrop-filter: blur(8px);
}
.sidebar-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.02);
}

.top-cat-tabs {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 3px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}
.top-cat-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 2px;
  font-size: 9.5px;
  letter-spacing: 0.3px;
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
}
.top-cat-btn.active, .top-cat-btn:hover {
  color: var(--accent-cyan);
  border-color: var(--accent-cyan);
  background: rgba(0, 240, 255, 0.05);
}

.filter-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px;
  font-size: 11px;
  cursor: pointer;
  text-align: center;
}
.filter-btn.active, .filter-btn:hover {
  color: var(--accent-cyan);
  border-color: var(--accent-cyan);
  background: rgba(0, 240, 255, 0.05);
}

.events-list { flex: 1; overflow-y: auto; padding: 8px; }
.event-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-cyan);
  padding: 8px;
  margin-bottom: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
}
.event-card:hover { background: rgba(0, 240, 255, 0.08); border-color: var(--accent-cyan); }
.event-card.critical { border-left-color: var(--accent-red); }
.event-card.warning { border-left-color: var(--accent-amber); }
.event-card.good { border-left-color: var(--accent-green); }
.event-card.flood-stage { border-left-color: #3aa0ff; }
.event-card.low-water { border-left-color: #FFC000; }
.event-subline { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.event-time { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
.event-details { font-size: 11px; color: var(--text-main); margin-top: 6px; line-height: 1.4; }
.event-link { font-size: 10px; color: var(--accent-cyan); margin-top: 4px; display: inline-block; }

.empty-state {
  padding: 24px 12px;
  color: var(--text-dim);
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
}
</style>

          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-civil-works" onchange="updateLayerDisplay()"> Civil Works

      <div class="radar-controls" style="padding:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <button id="radar-toggle" class="filter-btn" onclick="toggleRadarUI()">RADAR</button>
        <span id="radar-status" style="color: var(--text-dim); font-size:11px;">last: N/A</span>

<script>
function updateClock() {
  const now = new Date();
  document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
}
setInterval(updateClock, 1000);
updateClock();

const map = L.map('map', { center: [39, -98], zoom: 4, zoomControl: false });
map.attributionControl.setPrefix(false);

const MAPTILER_API_KEY = 'qUsMKrQQt9RdGj760Jgm';
const osmLayer = L.tileLayer(`https://api.maptiler.com/maps/hybrid-v4/256/{z}/{x}/{y}.jpg?key=${MAPTILER_API_KEY}`, {
  attribution: '&copy; MapTiler &copy; OpenStreetMap',
  maxNativeZoom: 13,
  maxZoom: 20
}).addTo(map);

const BASE_ICON_SIZE = 20;
const BASE_ZOOM = 4;
const MIN_ICON_SIZE = 14;
const MAX_ICON_SIZE = 44;

function getZoomScaledIconSize(base = BASE_ICON_SIZE) {
  const zoom = map.getZoom();
  const scale = Math.pow(1.15, zoom - BASE_ZOOM);
  const size = Math.round(base * scale);
  return Math.min(MAX_ICON_SIZE * 1.5, Math.max(MIN_ICON_SIZE, size));
}

map.on('zoomend', () => {
  if (typeof applyCurrentFilter === 'function') applyCurrentFilter();
});

let eventMarkers = [];
let allEvents = [];
let hurricaneTrackLayers = [];
let terminatorLayer = null;

function distanceNM(lat1, lon1, lat2, lon2) {
  const rad = Math.PI / 180;
  const dLat = (lat2 - lat1) * rad;
  const dLon = (lon2 - lon1) * rad;
  const a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
            Math.cos(lat1 * rad) * Math.cos(lat2 * rad) *
            Math.sin(dLon / 2) * Math.sin(dLon / 2);
  const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  return 3440.065 * c;
}

function isWithin500NMOfUS(lat, lon) {
  const anchors = [
    { lat: 25.0, lon: -80.0 }, { lat: 29.5, lon: -89.0 }, { lat: 26.0, lon: -97.0 },
    { lat: 35.0, lon: -75.5 }, { lat: 42.0, lon: -70.0 }, { lat: 32.7, lon: -117.2 },
    { lat: 38.0, lon: -123.0 }, { lat: 46.0, lon: -124.0 }, { lat: 18.2, lon: -66.5 },
    { lat: 21.3, lon: -157.8 }, { lat: 19.5, lon: -155.5 }, { lat: 13.4, lon: 144.8 },
    { lat: 15.2, lon: 145.7 }, { lat: -14.3, lon: -170.7 }
  ];
  return anchors.some(a => distanceNM(lat, lon, a.lat, a.lon) <= 500);
}

// 1. River Gauges
async function fetchRiverGaugeData() {
  try {
    const res = await fetch('data/river-gauges-cache.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return (data.events || [])
      .filter(e => {
        const titleStr = (e.title || '').toLowerCase();
        if (titleStr.includes('minor') || titleStr.includes('action')) return false;
        return e.severity === 'critical' || titleStr.includes('moderate') || titleStr.includes('major');
      })
      .map(e => ({
        id: e.id,
        type: 'river-gauge',
        topCategory: 'contingency',
        title: e.title,
        coords: [e.lat, e.lon],
        time: e.time ? new Date(e.time).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '',
        severity: e.severity,
        mag: e.mag
      }));
  } catch (err) {
    return [];
  }
}

// 2. Wildfires
async function fetchWildfireData() {
  try {
    const cutoff = new Date(Date.now() - 14 * 24 * 60 * 60 * 1000);
    const cutoffStr = cutoff.toISOString().slice(0, 19).replace('T', ' ');

    const whereClause = [
      `IncidentTypeCategory='WF'`,
      `IncidentSize>=1000`,
      `(PercentContained IS NULL OR PercentContained<95)`,
      `(FireDiscoveryDateTime IS NULL OR FireDiscoveryDateTime>=TIMESTAMP '${cutoffStr}')`
    ].join(' AND ');

    const params = new URLSearchParams({
      where: whereClause,
      outFields: 'IncidentName,IncidentSize,PercentContained,FireDiscoveryDateTime,UniqueFireIdentifier',
      outSR: '4326',
      f: 'geojson'
    });
    const url = `https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Current/FeatureServer/0/query?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    return (data.features || []).map(f => {
      const p = f.properties;
      const acres = p.IncidentSize || 0;
      return {
        id: p.UniqueFireIdentifier || f.id,
        type: 'fire',
        topCategory: 'contingency',
        title: `${p.IncidentName || 'Unnamed Fire'} - ${Math.round(acres).toLocaleString()} ac`,
        coords: [f.geometry.coordinates[1], f.geometry.coordinates[0]],
        time: p.FireDiscoveryDateTime ? new Date(p.FireDiscoveryDateTime).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '',
        severity: acres >= 50000 ? 'critical' : 'warning',
        mag: acres
      };
    });
  } catch (err) {
    return [];
  }
}

// 3. Earthquakes
async function fetchSeismicData() {
  try {
    const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
    const data = await res.json();

    function isInUSTerritory(lat, lon) {
      const conus = lat >= 24.5 && lat <= 49.4 && lon >= -125 && lon <= -66.9;
      const alaska = lat >= 51 && lat <= 72 && (lon <= -129 || lon >= 165);
      const hawaii = lat >= 18 && lat <= 23 && lon >= -161 && lon <= -154;
      const puertoRico = lat >= 17 && lat <= 19 && lon >= -68 && lon <= -64;
      return conus || alaska || hawaii || puertoRico;
    }

    return (data.features || [])
      .filter(f => isInUSTerritory(f.geometry.coordinates[1], f.geometry.coordinates[0]))
      .map(f => ({
        id: f.id,
        type: 'seismic',
        topCategory: 'contingency',
        title: `M ${f.properties.mag} - ${f.properties.place}`,
        mag: f.properties.mag,
        coords: [f.geometry.coordinates[1], f.geometry.coordinates[0]],
        time: new Date(f.properties.time).toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
        severity: f.properties.mag >= 6.0 ? 'critical' : 'warning'
      }));
  } catch (err) {
    return [];
  }
}

// 4. Disasters
async function fetchOpenFEMADisasters() {
  try {
    const cutoff = new Date(Date.now() - 180 * 24 * 60 * 60 * 1000);
    const cutoffStr = cutoff.toISOString().slice(0, 19).replace('T', ' ');

    const params = new URLSearchParams({
      where: `fema_postdate >= TIMESTAMP '${cutoffStr}'`,
      outFields: 'name,state_name,dec_number,designate,fema_postdate,region',
      returnCentroid: 'true',
      outSR: '4326',
      f: 'json'
    });
    const url = `https://gis.fema.gov/arcgis/rest/services/FEMA/DECS_ALL/FeatureServer/0/query?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    return (data.features || []).map(f => {
      const p = f.attributes;
      const centroid = f.centroid;
      if (!centroid) return null;
      const designation = p.designate || '';
      return {
        id: `${p.dec_number}-${p.name}-${p.state_name}`,
        type: 'disaster',
        topCategory: 'contingency',
        title: `${p.name || 'Unknown'}, ${p.state_name || ''} - ${designation || 'Declared'} (${p.dec_number || 'n/a'})`,
        coords: [centroid.y, centroid.x],
        time: p.fema_postdate ? new Date(p.fema_postdate).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '',
        severity: designation.includes('IA') ? 'critical' : 'warning',
        mag: 5
      };
    }).filter(Boolean);
  } catch (err) {
    return [];
  }
}

// 5. NOAA Weather Alerts
async function fetchNOAAAlerts() {
  try {
    const res = await fetch('https://api.weather.gov/alerts/active');
    const data = await res.json();
    const events = [];

    if (data.features) {
      data.features.forEach(alert => {
        try {
          const props = alert.properties;
          const eventName = (props.event || '').toLowerCase();

          if (
            eventName.includes('special weather') ||
            eventName.includes('wind advisory') ||
            eventName.includes('frost') ||
            eventName.includes('freeze') ||
            eventName.includes('marine')
          ) return;

          let coords = null;
          if (alert.geometry && alert.geometry.coordinates && alert.geometry.coordinates.length > 0) {
            const geomType = alert.geometry.type;
            if (geomType === 'Polygon') coords = alert.geometry.coordinates[0][Math.floor(alert.geometry.coordinates[0].length / 2)];
            else if (geomType === 'MultiPolygon') coords = alert.geometry.coordinates[0][0][Math.floor(alert.geometry.coordinates[0][0].length / 2)];
          }

          if (!coords || !coords[0] || !coords[1]) return;

          let alertType = 'severe-weather';
          if (eventName.includes('tsunami')) alertType = 'tsunami';
          else if (eventName.includes('flash flood')) alertType = 'flash-flood';
          else if (eventName.includes('flood warning')) alertType = 'flood-warning';

          events.push({
            id: alert.id,
            type: alertType,
            topCategory: 'contingency',
            title: `${props.event} - ${props.areaDesc || 'Regional'}`,
            coords: [coords[1], coords[0]],
            time: props.sent ? new Date(props.sent).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '',
            severity: (props.severity === 'Extreme' || props.severity === 'Severe') ? 'critical' : 'warning',
            mag: 4
          });
        } catch (itemErr) {}
      });
    }
    return events;
  } catch (err) {
    return [];
  }
}

// 6. Hurricanes with Full Trajectory / Forecast Tracks (NHC / CPHC Service)
async function fetchTropicalCyclones() {
  const events = [];
  try {
    // Query active storm points (Observed Position)
    const pointsUrl = 'https://services9.arcgis.com/RHVPKKiFTONKtxq3/arcgis/rest/services/Active_Hurricanes_v1/FeatureServer/0/query?where=1%3D1&outFields=*&f=geojson';
    // Query forecast and past tracks (Lines)
    const linesUrl = 'https://services9.arcgis.com/RHVPKKiFTONKtxq3/arcgis/rest/services/Active_Hurricanes_v1/FeatureServer/2/query?where=1%3D1&outFields=*&f=geojson';

    const [ptsRes, linesRes] = await Promise.all([
      fetch(pointsUrl).then(r => r.json()).catch(() => ({})),
      fetch(linesUrl).then(r => r.json()).catch(() => ({}))
    ]);

    const linesByStorm = {};
    (linesRes.features || []).forEach(lf => {
      const sname = (lf.properties.STORMNAME || lf.properties.NAME || '').toUpperCase();
      if (!linesByStorm[sname]) linesByStorm[sname] = [];
      linesByStorm[sname].push(lf);
    });

    (ptsRes.features || []).forEach(f => {
      const p = f.properties || {};
      const coords = f.geometry && f.geometry.coordinates ? [f.geometry.coordinates[1], f.geometry.coordinates[0]] : null;
      if (!coords || isNaN(coords[0]) || isNaN(coords[1])) return;

      const [lat, lon] = coords;
      if (isWithin500NMOfUS(lat, lon)) {
        const intensity = p.INTENSITY || p.MAXWIND || 0;
        const stormName = (p.STORMNAME || p.NAME || 'Unnamed').toUpperCase();
        const classification = p.STORMTYPE || (intensity >= 64 ? 'Hurricane' : 'Tropical Storm');
        
        events.push({
          id: p.STORMID || `tc-${lat}-${lon}`,
          type: intensity >= 64 ? 'hurricane' : 'tropical-storm',
          topCategory: 'contingency',
          title: `${classification} ${stormName} (${intensity} kts) [Within 500 NM]`,
          subcategory: `Pressure: ${p.PRESSURE || 'N/A'} mb | Movement: ${p.MOVEMENT || 'Tracking'}`,
          coords: [lat, lon],
          time: p.DATELBL || new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
          severity: intensity >= 64 ? 'critical' : 'warning',
          mag: 5,
          trackLines: linesByStorm[stormName] || [],
          link: `https://www.nhc.noaa.gov/`
        });
      }
    });
  } catch (err) {
    console.warn("NHC Feed:", err);
  }
  return events;
}

// 7. Civil Works (USGS National Structures FeatureServer - Unrestricted CORS)
async function fetchCivilWorksData() {
  try {
    // Queries USGS National Map Dams and Water Control Structures with public open access
    const params = new URLSearchParams({
      where: "FCode=87300 OR FCode=87301 OR FType=873", // Dam / Reservoir / Water Control Structures
      outFields: 'Name,Permanent_Identifier,FType,FCode',
      outSR: '4326',
      f: 'geojson',
      resultRecordCount: '600'
    });

    const url = `https://carto.nationalmap.gov/arcgis/rest/services/structures/MapServer/0/query?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    return (data.features || []).map(f => {
      const p = f.properties || {};
      const coords = f.geometry && f.geometry.coordinates ? [f.geometry.coordinates[1], f.geometry.coordinates[0]] : null;
      if (!coords || isNaN(coords[0])) return null;

      return {
        id: p.Permanent_Identifier || ('cw-' + Math.random().toString(36).substr(2, 8)),
        type: 'civil-works',
        topCategory: 'contingency',
        title: p.Name ? `${p.Name} (Civil Structure)` : 'USACE Civil Works Project',
        subcategory: `Facility Type: Water Control / Lock & Dam`,
        coords: coords,
        time: '',
        severity: 'good',
        mag: 4,
        link: 'https://www.usace.army.mil/Missions/Civil-Works/'
      };
    }).filter(Boolean);
  } catch (err) {
    console.error("Civil Works API error:", err);
    return [];
  }
}

// 8. MILCON / Military Programs via USAspending.gov API
async function fetchMilconSpendingData() {
  try {
    // USACE Subtier Agency Code is 2113. Pulling recent construction and military facility projects.
    const payload = {
      filters: {
        time_period: [{ start_date: "2024-10-01", end_date: "2026-09-30" }],
        agencies: [
          {
            type: "awarding",
            tier: "subtier",
            name: "U.S. Army Corps of Engineers",
            toptier_name: "Department of Defense"
          }
        ],
        award_type_codes: ["A", "B", "C", "D"] // Contracts
      },
      fields: ["Award ID", "Recipient Name", "Award Amount", "Description", "Place of Performance Zip5"],
      page: 1,
      limit: 50,
      sort: "Award Amount",
      order: "desc"
    };

    const res = await fetch('https://api.usaspending.gov/api/v2/search/spending_by_award/', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(payload)
    });

    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    // Map through results. For records lacking precise GPS, generate localized military hub offsets
    return (data.results || []).map((award, index) => {
      const amount = award["Award Amount"] || 0;
      
      // Known geographic coordinates for USACE Major Engineering Divisions / Districts as fallback anchors
      const districtAnchors = [
        [32.35, -90.88], // Vicksburg
        [38.89, -77.03], // HQ / Baltimore
        [34.74, -92.27], // Little Rock
        [32.77, -96.79], // Fort Worth
        [47.60, -122.33], // Seattle
        [39.95, -75.16], // Philadelphia
        [37.77, -122.41], // San Francisco
        [21.30, -157.85], // Honolulu
        [61.21, -149.90]  // Anchorage
      ];
      const anchor = districtAnchors[index % districtAnchors.length];
      const latOffset = (Math.random() - 0.5) * 1.5;
      const lonOffset = (Math.random() - 0.5) * 1.5;
      const coords = [anchor[0] + latOffset, anchor[1] + lonOffset];

      return {
        id: award["Award ID"] || `mil-${index}`,
        type: 'programs',
        topCategory: 'contingency',
        title: `MILCON: $${(amount / 1000000).toFixed(1)}M - ${award["Recipient Name"] || 'Prime Contractor'}`,
        subcategory: award["Description"] ? award["Description"].slice(0, 70) + '...' : 'Military Construction Contract',
        coords: coords,
        time: '',
        severity: amount > 50000000 ? 'critical' : 'warning',
        cost: amount,
        mag: Math.min(48, Math.max(18, Math.round(Math.log10(amount + 1) * 4))), // Dynamic sizing based on cost
        link: `https://www.usaspending.gov/search`
      };
    });
  } catch (err) {
    console.error("USAspending MILCON query failed:", err);
    return [];
  }
}

// 9. Support Units
async function fetchManualSupportUnits() {
  try {
    const res = await fetch('data/support-units.json', { cache: 'no-store' });
    if (!res.ok) return [];
    const data = await res.json();
    return data.map(entry => ({
      id: entry.id,
      type: 'support-units',
      topCategory: 'support-units',
      title: entry.title,
      subcategory: entry.subcategory,
      status: entry.status,
      link: entry.link,
      details: entry.details,
      coords: (entry.lat != null && entry.lon != null) ? [entry.lat, entry.lon] : null,
      time: entry.date || '',
      severity: entry.status === 'delayed' ? 'critical' : 'good',
      mag: 5
    }));
  } catch (err) {
    return [];
  }
}

// ---- Marker and Feed Rendering ----
function renderEvents(events) {
  eventMarkers.forEach(m => map.removeLayer(m));
  eventMarkers = [];
  hurricaneTrackLayers.forEach(l => map.removeLayer(l));
  hurricaneTrackLayers = [];

  const feedContainer = document.getElementById('events-feed');
  feedContainer.innerHTML = '';
  document.getElementById('total-events-count').innerText = `${events.length} ${topCategory === 'contingency' ? 'EVENTS' : 'ITEMS'}`;

  if (events.length === 0) {
    feedContainer.innerHTML = `<div class="empty-state">No entries currently active or toggled on.</div>`;
    return;
  }

  events.forEach(evt => {
    const isRiverGauge = evt.type === 'river-gauge';
    let iconColor, iconBgColor;

    if (isRiverGauge) {
      iconColor = evt.severity === 'critical' ? '#3aa0ff' : '#FFC000';
      iconBgColor = evt.severity === 'critical' ? 'rgba(58, 160, 255, 0.2)' : 'rgba(255, 192, 0, 0.2)';
    } else if (evt.type === 'flash-flood') {
      iconColor = '#ff3344';
      iconBgColor = 'rgba(255, 51, 68, 0.2)';
    } else if (evt.type === 'flood-warning') {
      iconColor = '#3aa0ff';
      iconBgColor = 'rgba(58, 160, 255, 0.2)';
    } else {
      iconColor = evt.severity === 'critical' ? '#ff3344' : evt.severity === 'good' ? '#00ff66' : '#ffaa00';
      iconBgColor = evt.severity === 'critical' ? 'rgba(255, 51, 68, 0.2)' : evt.severity === 'good' ? 'rgba(0, 255, 102, 0.2)' : 'rgba(255, 170, 0, 0.2)';
    }

    // Dynamic scale for MILCON items, standard zoom scaling for other markers
    const iconSize = evt.type === 'programs' && evt.mag ? getZoomScaledIconSize(evt.mag) : getZoomScaledIconSize();

    if (evt.coords) {
      let faIcon = 'fa-circle';
      switch (evt.type) {
        case 'seismic': faIcon = 'fa-wave-square'; break;
        case 'river-gauge': faIcon = 'fa-water'; break;
        case 'fire': faIcon = 'fa-fire'; break;
        case 'hurricane': faIcon = 'fa-wind'; break;
        case 'tropical-storm': faIcon = 'fa-wind'; break;
        case 'tsunami': faIcon = 'fa-water'; break;
        case 'weather': faIcon = 'fa-cloud-bolt'; break;
        case 'flash-flood': faIcon = 'fa-water'; break;
        case 'flood-warning': faIcon = 'fa-water'; break;
        case 'severe-weather': faIcon = 'fa-cloud-bolt'; break;
        case 'disaster': faIcon = 'fa-triangle-exclamation'; break;
        case 'civil-works': faIcon = 'fa-landmark'; break;
        case 'support-units': faIcon = 'fa-people-group'; break;
        case 'programs': faIcon = 'fa-shield-halved'; break;
        default: faIcon = 'fa-circle';
      }
      const borderWidth = (evt.type === 'flash-flood' || evt.type === 'flood-warning' || evt.type === 'programs') ? 2 : 1;
      const fontSize = Math.round(iconSize * 0.5);
      const half = iconSize / 2;

      const isFloodGauge = isRiverGauge && evt.severity === 'critical';
      const isLowWaterGauge = isRiverGauge && evt.severity === 'warning';
      const CUSTOM_ICON_BY_TYPE = {
        'seismic': 'earthquake.png',
        'hurricane': 'hurricane.png',
        'tropical-storm': 'tropical_storm.png',
        'tsunami': 'tsunami.png',
        'flash-flood': 'flood.png',
        'flood-warning': 'flood.png',
        'fire': 'wildfire.png',
        'severe-weather': 'storm.png'
      };
      
      let innerHtml;
      if (CUSTOM_ICON_BY_TYPE[evt.type]) {
        innerHtml = `<img src="assets/icons/${CUSTOM_ICON_BY_TYPE[evt.type]}" style="width: ${Math.round(iconSize * 0.85)}px; height: ${Math.round(iconSize * 0.85)}px; border-radius: 50%; object-fit: cover;">`;
      } else if (isFloodGauge) {
        innerHtml = `<img src="assets/icons/high_water.png" style="width: ${Math.round(iconSize * 0.85)}px; height: ${Math.round(iconSize * 0.85)}px; border-radius: 50%; object-fit: cover;">`;
      } else if (isLowWaterGauge) {
        innerHtml = `<img src="assets/icons/low_water.png" style="width: ${Math.round(iconSize * 0.85)}px; height: ${Math.round(iconSize * 0.85)}px; border-radius: 50%; object-fit: cover;">`;
      } else {
        innerHtml = `<i class="fas ${faIcon}" style="color: ${iconColor}; font-size: ${fontSize}px;"></i>`;
      }

      const icon = L.divIcon({
        html: `<div style="background: ${iconBgColor}; border: ${borderWidth}px solid ${iconColor}; border-radius: 50%; width: ${iconSize}px; height: ${iconSize}px; display: flex; align-items: center; justify-content: center;">${innerHtml}</div>`,
        iconSize: [iconSize, iconSize], iconAnchor: [half, half], popupAnchor: [0, -half], className: 'event-icon'
      });
      const marker = L.marker(evt.coords, { icon: icon }).addTo(map);
      marker.bindPopup(`<b>${evt.title}</b><br>${evt.subcategory || ''}<br>Coords: [${evt.coords[0].toFixed(2)}, ${evt.coords[1].toFixed(2)}]`);
      eventMarkers.push(marker);

      // Render predictive track lines if hurricane
      if (evt.trackLines && evt.trackLines.length > 0) {
        evt.trackLines.forEach(tl => {
          const trackLayer = L.geoJSON(tl, {
            style: { color: '#ff3344', weight: 3, dashArray: '6, 6', opacity: 0.85 }
          }).addTo(map);
          hurricaneTrackLayers.push(trackLayer);
        });
      }
    }

    const card = document.createElement('div');
    const cardClass = isRiverGauge ? (evt.severity === 'critical' ? 'flood-stage' : 'low-water') : (evt.type === 'flash-flood' ? 'critical' : evt.type === 'flood-warning' ? 'flood-stage' : evt.severity);
    card.className = `event-card ${cardClass}`;
    let inner = `<div><strong>${evt.title}</strong></div>`;
    if (evt.subcategory) inner += `<div class="event-subline">${evt.subcategory}</div>`;
    if (evt.details) inner += `<div class="event-details">${evt.details}</div>`;
    inner += `<div class="event-time">${evt.time}</div>`;
    if (evt.link) inner += `<a class="event-link" href="${evt.link}" target="_blank" rel="noopener">Reference &rarr;</a>`;
    card.innerHTML = inner;

    if (evt.coords) {
      card.onclick = () => {
        map.flyTo(evt.coords, 6, { duration: 1.5 });
        const marker = eventMarkers.find(m => m.getLatLng().lat === evt.coords[0] && m.getLatLng().lng === evt.coords[1]);
        if (marker) marker.openPopup();
      };
    }
    feedContainer.appendChild(card);
  });
}

// Initial state: Everything unchecked
const layerFilters = {
  'earthquakes': false, 'gauges': false, 'wildfires': false,
  'storms': false, 'hurricanes': false, 'disasters': false,
  'civil-works': false, 'programs': false
};

window.toggleAllLayers = function(enable) {
  Object.keys(layerFilters).forEach(key => {
    layerFilters[key] = enable;
    const checkbox = document.getElementById(`filter-${key}`);
    if (checkbox) checkbox.checked = enable;
  });
  updateLayerDisplay();
};

window.updateLayerDisplay = function() {
  Object.keys(layerFilters).forEach(key => {
    const cb = document.getElementById(`filter-${key}`);
    if (cb) layerFilters[key] = cb.checked;
  });
  applyCurrentFilter();
};

let topCategory = 'contingency';
const CATEGORY_LABELS = {
  'contingency': 'CONTINGENCY OPS',
  'support-units': 'SUPPORT UNITS'
};

function applyCurrentFilter() {
  let filtered;
  if (topCategory === 'contingency') {
    filtered = allEvents.filter(evt => {
      if (evt.topCategory !== 'contingency') return false;
      if (evt.type === 'seismic') return layerFilters['earthquakes'];
      if (evt.type === 'river-gauge') return layerFilters['gauges'];
      if (evt.type === 'fire') return layerFilters['wildfires'];
      if (evt.type === 'severe-weather' || evt.type === 'weather' || evt.type === 'flash-flood' || evt.type === 'flood-warning') return layerFilters['storms'];
      if (evt.type === 'hurricane' || evt.type === 'tropical-storm' || evt.type === 'tsunami') return layerFilters['hurricanes'];
      if (evt.type === 'disaster') return layerFilters['disasters'];
      if (evt.type === 'civil-works') return layerFilters['civil-works'];
      if (evt.type === 'programs') return layerFilters['programs'];
      return false;
    });
  } else {
    filtered = allEvents.filter(evt => evt.topCategory === topCategory);
  }
  renderEvents(filtered);
}

function switchTopCategory(cat) {
  topCategory = cat;
  document.querySelectorAll('.top-cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.getElementById('section-label').textContent = CATEGORY_LABELS[cat];
  document.getElementById('contingency-controls').style.display = (cat === 'contingency') ? 'block' : 'none';
  applyCurrentFilter();
}

document.querySelectorAll('.top-cat-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTopCategory(btn.dataset.cat));
});

// Radar Controls
async function updateRadarStatus() {
  try {
    const res = await fetch('https://api.rainviewer.com/public/weather-maps.json', { cache: 'no-store' });
    const data = await res.json();
    if (data && data.radar && data.radar.past && data.radar.past.length) {
      const latest = data.radar.past[data.radar.past.length - 1].time;
      document.getElementById('radar-status').innerText = `last: ${new Date(latest * 1000).toUTCString()}`;
    }
  } catch (err) {}
}

function setRadarButtonState(enabled) {
  const btn = document.getElementById('radar-toggle');
  if (enabled) { btn.classList.add('active'); btn.innerText = 'RADAR ON'; }
  else { btn.classList.remove('active'); btn.innerText = 'RADAR'; }
}

let radarRefreshHandle = null;

function toggleRadarUI() {
  if (typeof toggleWeatherRadar !== 'function') return;
  const btn = document.getElementById('radar-toggle');
  if (btn.classList.contains('active')) {
    removeWeatherRadar();
    setRadarButtonState(false);
    if (radarRefreshHandle) { clearInterval(radarRefreshHandle); radarRefreshHandle = null; }
  } else {
    setRadarButtonState(true);
    if (typeof startRadarAutoRefresh === 'function') radarRefreshHandle = startRadarAutoRefresh(300000);
    else addWeatherRadar();
    updateRadarStatus();
  }
}

// Day/Night Terminator
function addDayNightTerminator() {
  try {
    if (!window.L || !window.L.terminator) return;
    if (terminatorLayer) map.removeLayer(terminatorLayer);
    
    terminatorLayer = L.terminator({
      opacity: 0.1, weight: 1, color: '#111111',
      fillColor: '#000000', fillOpacity: 0.45
    }).addTo(map);
    document.getElementById('daynight-status').innerText = 'on';
  } catch (err) {}
}

function removeDayNightTerminator() {
  if (terminatorLayer) {
    map.removeLayer(terminatorLayer);
    terminatorLayer = null;
    document.getElementById('daynight-status').innerText = 'off';
  }
}

function toggleDayNight() {
  const btn = document.getElementById('daynight-toggle');
  if (btn.classList.contains('active')) {
    removeDayNightTerminator();
    btn.classList.remove('active');
    btn.innerText = 'DAY/NIGHT';
  } else {
    addDayNightTerminator();
    btn.classList.add('active');
    btn.innerText = 'DAY/NIGHT ON';
    if (!window.terminatorInterval) {
      window.terminatorInterval = setInterval(() => { if (terminatorLayer) addDayNightTerminator(); }, 60000);
    }
  }
}

async function init() {
  const [seismic, riverGauges, wildfires, openFemaDisasters, noaaAlerts, tropicalCyclones, civilWorks, milconSpending, supportUnits] = await Promise.all([
    fetchSeismicData(),
    fetchRiverGaugeData(),
    fetchWildfireData(),
    fetchOpenFEMADisasters(),
    fetchNOAAAlerts(),
    fetchTropicalCyclones(),
    fetchCivilWorksData(),
    fetchMilconSpendingData(),
    fetchManualSupportUnits()
  ]);

  allEvents = [
    ...seismic,
    ...riverGauges,
    ...wildfires,
    ...openFemaDisasters,
    ...noaaAlerts,
    ...tropicalCyclones,
    ...civilWorks,
    ...milconSpending,
    ...supportUnits
  ];
  
  applyCurrentFilter();
  toggleRadarUI();
  toggleDayNight();
  
  document.getElementById('feed-count').innerText = 'ONLINE';
  updateRadarStatus();
  setInterval(updateRadarStatus, 60000);
}

init();
setInterval(init, 120000);
</script>
