<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>USACE Operations Monitor</title>

<!-- Leaflet CSS & JS -->
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<!-- Leaflet Terminator (Day/Night overlay) - from CDN -->
<script src="https://unpkg.com/leaflet-terminator/L.Terminator.js"></script>

<!-- Font Awesome Icons -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />

<!-- Tactical Monospace Fonts -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
:root {
  --bg-base: #0a0c10;
  --bg-panel: rgba(14, 18, 24, 0.92);
  --border: #1e2638;
  --accent-cyan: #00f0ff;
  --accent-red: #ff3344;
  --accent-amber: #ffaa00;
  --accent-green: #00ff66;
  --text-main: #c0caf5;
  --text-dim: #565f89;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Share Tech Mono', monospace; }
body {
  background-color: var(--bg-base);
  color: var(--text-main);
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

/* Top Bar */
header {
  background: #05070a;
  border-bottom: 1px solid var(--border);
  padding: 6px 14px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 13px;
  z-index: 1000;
}
.brand { display: flex; align-items: center; gap: 10px; }
.status-badge {
  background: rgba(0, 255, 102, 0.15);
  border: 1px solid var(--accent-green);
  color: var(--accent-green);
  padding: 2px 6px;
  font-size: 10px;
  border-radius: 2px;
  letter-spacing: 1px;
}
.top-controls { display: flex; align-items: center; gap: 15px; }
.top-controls a.admin-link {
  color: var(--text-dim);
  text-decoration: none;
  font-size: 11px;
  border: 1px solid var(--border);
  padding: 3px 8px;
}
.top-controls a.admin-link:hover { color: var(--accent-cyan); border-color: var(--accent-cyan); }

/* Breaking Marquee */
.ticker-bar {
  background: rgba(255, 51, 68, 0.1);
  border-bottom: 1px solid rgba(255, 51, 68, 0.3);
  color: #ff8899;
  font-size: 12px;
  padding: 4px 12px;
  display: flex;
  align-items: center;
  white-space: nowrap;
  overflow: hidden;
}
.ticker-bar span.label { color: var(--accent-red); font-weight: bold; margin-right: 12px; }

/* Main Workspace Layout */
.workspace { flex: 1; display: flex; position: relative; height: calc(100vh - 65px); }
#map { flex: 1; height: 100%; background: #000; }

/* Tactical Sidebar */
aside {
  width: 400px;
  background: var(--bg-panel);
  border-left: 1px solid var(--border);
  display: flex;
  flex-direction: column;
  z-index: 999;
  backdrop-filter: blur(8px);
}
.sidebar-header {
  padding: 10px 14px;
  border-bottom: 1px solid var(--border);
  font-size: 13px;
  display: flex;
  justify-content: space-between;
  background: rgba(255, 255, 255, 0.02);
}

/* Top-level category tabs */
.top-cat-tabs {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 3px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}
.top-cat-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 8px 2px;
  font-size: 9.5px;
  letter-spacing: 0.3px;
  cursor: pointer;
  text-align: center;
  line-height: 1.3;
}
.top-cat-btn.active, .top-cat-btn:hover {
  color: var(--accent-cyan);
  border-color: var(--accent-cyan);
  background: rgba(0, 240, 255, 0.05);
}

.filter-tabs {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px;
  padding: 8px;
  border-bottom: 1px solid var(--border);
}
.filter-btn {
  background: transparent;
  border: 1px solid var(--border);
  color: var(--text-dim);
  padding: 6px;
  font-size: 11px;
  cursor: pointer;
  text-align: center;
}
.filter-btn.active, .filter-btn:hover {
  color: var(--accent-cyan);
  border-color: var(--accent-cyan);
  background: rgba(0, 240, 255, 0.05);
}

.events-list { flex: 1; overflow-y: auto; padding: 8px; }
.event-card {
  background: rgba(255, 255, 255, 0.02);
  border: 1px solid var(--border);
  border-left: 3px solid var(--accent-cyan);
  padding: 8px;
  margin-bottom: 8px;
  font-size: 12px;
  cursor: pointer;
  transition: all 0.15s ease-in-out;
}
.event-card:hover { background: rgba(0, 240, 255, 0.08); border-color: var(--accent-cyan); }
.event-card.critical { border-left-color: var(--accent-red); }
.event-card.warning { border-left-color: var(--accent-amber); }
.event-card.good { border-left-color: var(--accent-green); }
.event-card.flood-stage { border-left-color: #3aa0ff; }
.event-card.low-water { border-left-color: #FFC000; }
.event-subline { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
.event-time { font-size: 10px; color: var(--text-dim); margin-top: 4px; }
.event-details { font-size: 11px; color: var(--text-main); margin-top: 6px; line-height: 1.4; }
.event-link { font-size: 10px; color: var(--accent-cyan); margin-top: 4px; display: inline-block; }

.empty-state {
  padding: 24px 12px;
  color: var(--text-dim);
  text-align: center;
  font-size: 12px;
  line-height: 1.6;
}
.empty-state a { color: var(--accent-cyan); }

/* Map UI Pulsing Markers */
.pulse-marker {
  width: 14px; height: 14px; border-radius: 50%;
  background: var(--accent-red); box-shadow: 0 0 10px var(--accent-red);
  animation: pulse 1.5s infinite ease-out;
}
@keyframes pulse { 0% { transform: scale(0.9); opacity: 1; } 100% { transform: scale(2.2); opacity: 0; } }
</style>
</head>
<body>

<!-- Header -->
<header>
  <div class="brand">
    <span class="status-badge">● LIVE OPS</span>
    <span style="font-weight: bold; letter-spacing: 1px;">USACE OPERATIONS MONITOR</span>
  </div>
  <div class="top-controls">
    <span id="utc-clock">00:00:00 UTC</span>
    <span style="color: var(--text-dim);">FEEDS: <span id="feed-count" style="color: var(--accent-green);">SYNCING</span></span>
    <a class="admin-link" href="admin.html">+ ADD ENTRY</a>
  </div>
</header>

<!-- Breaking News Ticker -->
<div class="ticker-bar">
  <span class="label">PRIORITY ALERTS ❯❯</span>
  <marquee scrollamount="5" id="news-marquee">Monitoring U.S. disasters, river gauges, weather, and emergency operations in real-time...</marquee>
</div>

<!-- Workspace -->
<div class="workspace">
  <div id="map"></div>

  <aside>
    <div class="sidebar-header">
      <span id="section-label">CONTINGENCY OPS</span>
      <span id="total-events-count" style="color: var(--accent-cyan);">0 ACTIVE</span>
    </div>

    <!-- Top-level category tabs -->
    <div class="top-cat-tabs">
      <button class="top-cat-btn active" data-cat="contingency">CONTIN-<br>GENCY</button>
      <button class="top-cat-btn" data-cat="civil-works">CIVIL<br>WORKS</button>
      <button class="top-cat-btn" data-cat="programs">MIL<br>PROGRAMS</button>
      <button class="top-cat-btn" data-cat="support-units">SUPPORT<br>UNITS</button>
    </div>

    <!-- Contingency Ops sub-layer controls (only shown for this category) -->
    <div id="contingency-controls">
      <div class="filter-tabs">
        <div style="display: flex; gap: 4px; margin-bottom: 6px;">
          <button class="filter-btn" onclick="toggleAllLayers(true)" style="flex: 0.5;">ALL</button>
          <button class="filter-btn" onclick="toggleAllLayers(false)" style="flex: 0.5;">NONE</button>
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 4px;">
          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-earthquakes" checked onchange="updateLayerDisplay()"> Earthquakes
          </label>
          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-gauges" checked onchange="updateLayerDisplay()"> River Gauges
          </label>
          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-wildfires" onchange="updateLayerDisplay()"> Wildfires
          </label>
          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-storms" onchange="updateLayerDisplay()"> Storms
          </label>
          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-weather" onchange="updateLayerDisplay()"> Weather Alerts
          </label>
          <label style="display: flex; align-items: center; gap: 6px; padding: 6px; background: rgba(255,255,255,0.02); border: 1px solid var(--border); cursor: pointer; font-size: 11px;">
            <input type="checkbox" id="filter-disasters" onchange="updateLayerDisplay()"> Disasters
          </label>
        </div>
      </div>

      <!-- Radar controls -->
      <div class="radar-controls" style="padding:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <button id="radar-toggle" class="filter-btn" onclick="toggleRadarUI()">RADAR</button>
        <span id="radar-status" style="color: var(--text-dim); font-size:11px;">last: N/A</span>
      </div>

      <!-- Day/Night Terminator controls -->
      <div class="daynight-controls" style="padding:8px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:8px;">
        <button id="daynight-toggle" class="filter-btn" onclick="toggleDayNight()">DAY/NIGHT</button>
        <span id="daynight-status" style="color: var(--text-dim); font-size:11px;">off</span>
      </div>

      <!-- SAT toggle removed — the base map itself is now MapTiler's satellite hybrid imagery,
           making a separate NASA GIBS overlay redundant (it would just layer one satellite
           image over another). -->
    </div>

    <div class="events-list" id="events-feed">
      <div style="padding: 12px; color: var(--text-dim); text-align: center;">Fetching telemetry data...</div>
    </div>
  </aside>
</div>

<!-- Load radar.js (must come before main inline script so UI can call functions) -->
<script src="radar.js"></script>

<script>
// 1. Clock Tracker
function updateClock() {
  const now = new Date();
  document.getElementById('utc-clock').innerText = now.toUTCString().split(' ')[4] + ' UTC';
}
setInterval(updateClock, 1000);
updateClock();

// 2. Initialize Map (centered on USA)
const map = L.map('map', { center: [39, -98], zoom: 4, zoomControl: false });
// Removes Leaflet's own "Leaflet" self-promotional prefix (which includes a Ukraine-flag
// credit by default) from the attribution control. This is separate from — and doesn't
// affect — the actual required attributions for MapTiler, OpenStreetMap, and RainViewer,
// which are set per-layer below and stay intact.
map.attributionControl.setPrefix(false);
// Base map: MapTiler's hybrid satellite imagery (raster tiles). We went through three
// free/unauthenticated options before this — OpenStreetMap's own tile server (blocked by
// their usage policy for a live public site), CARTO's dark basemap (now requires a key,
// and even with one still hit the same zoom-cap issue — CARTO is retiring this raster
// service), and Esri's legacy dark gray canvas (Esri has been pushing developers off this
// exact legacy endpoint too, toward their own newer key-based service). All three "free"
// options turned out to be in some stage of the same industry-wide move away from free
// unauthenticated tile serving. MapTiler is used here as a properly-provisioned, key-based
// provider from the start rather than continuing to chase free options likely to hit the
// same wall eventually.
//
// Sign up for a free key at https://cloud.maptiler.com and paste it below. The key shown
// in MapTiler's own documentation examples is their public demo key — it won't work here,
// since it's typically restricted to MapTiler's own domain.
const MAPTILER_API_KEY = 'qUsMKrQQt9RdGj760Jgm';
const osmLayer = L.tileLayer(`https://api.maptiler.com/maps/hybrid-v4/256/{z}/{x}/{y}.jpg?key=${MAPTILER_API_KEY}`, {
  attribution: '&copy; MapTiler &copy; OpenStreetMap contributors',
  // Unlike a drawn/cartographic map style, satellite imagery resolution isn't uniform —
  // cities and populated areas often have much higher-resolution source photography than
  // remote rural regions. Zooming in over a sparsely populated area can hit tiles where
  // that deeper resolution was never captured, and MapTiler serves a "Zoom Level Not
  // Supported" placeholder for that specific tile (while a nearby city tile at the same
  // zoom loads fine). Capping maxNativeZoom conservatively avoids relying on deeper zoom
  // levels that aren't reliably available everywhere; Leaflet stretches the zoom-13 tile
  // for closer zooms instead of requesting resolution that may not exist for that spot.
  maxNativeZoom: 13,
  maxZoom: 20
}).addTo(map);

// Base marker size (20px — 25% larger than the previous fixed 16px) at the map's starting
// zoom level (4). Markers scale up when zooming in and down when zooming out, clamped to a
// sensible range so they never disappear or get comically large.
const BASE_ICON_SIZE = 20;
const BASE_ZOOM = 4;
const MIN_ICON_SIZE = 14;
const MAX_ICON_SIZE = 44;

function getZoomScaledIconSize() {
  const zoom = map.getZoom();
  const scale = Math.pow(1.15, zoom - BASE_ZOOM);
  const size = Math.round(BASE_ICON_SIZE * scale);
  return Math.min(MAX_ICON_SIZE, Math.max(MIN_ICON_SIZE, size));
}

// Leaflet doesn't automatically resize divIcon markers on zoom — rebuild them at the
// newly-scaled size whenever the zoom level changes.
map.on('zoomend', () => {
  if (typeof applyCurrentFilter === 'function') applyCurrentFilter();
});

let eventMarkers = [];
let allEvents = [];
let terminatorLayer = null;

// ---- Live data feeds (Contingency Ops) ----

// River gauge data comes from a static file (data/river-gauges-cache.json) that a GitHub
// Actions workflow (.github/workflows/update-river-gauges.yml) regenerates once an hour by
// calling NOAA's National Water Prediction Service (NWPS) API server-side. NWPS is free and
// requires no API key, but we still fetch it server-side rather than from the browser to
// keep visitor page loads from generating repeated calls to a small government service.
// Only gauges in low-water or flood-stage status are included — see scripts/fetch-river-gauges.js.
async function fetchRiverGaugeData() {
  try {
    const res = await fetch('data/river-gauges-cache.json', { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return (data.events || []).map(e => ({
      id: e.id,
      type: 'river-gauge',
      topCategory: 'contingency',
      title: e.title,
      coords: [e.lat, e.lon],
      time: e.time ? new Date(e.time).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '',
      severity: e.severity,
      mag: e.mag
    }));
  } catch (err) {
    console.error("Failed to load cached river gauge data:", err);
    return [];
  }
}

// Wildfire incident data from NIFC's Wildland Fire Interagency Geospatial Services (WFIGS) —
// the authoritative federal source, free and public with no API key needed. Reference:
// https://data-nifc.opendata.arcgis.com/
const WILDFIRE_MIN_ACRES = 10000;       // only large fires
const WILDFIRE_MAX_CONTAINMENT_PCT = 90; // drop fires that are effectively wrapped up
const WILDFIRE_MAX_AGE_DAYS = 14;        // drop stale/lingering records

async function fetchWildfireData() {
  try {
    // Each added condition is wrapped with "field IS NULL OR ..." so a fire isn't excluded
    // just because WFIGS hasn't populated that particular field yet for it — per the request,
    // these filters only apply "if that data is available."
    const whereClause = [
      `IncidentTypeCategory='WF'`, // wildfires only — excludes RX prescribed burns and CX complexes
      `IncidentSize>=${WILDFIRE_MIN_ACRES}`,
      `(PercentContained IS NULL OR PercentContained<${WILDFIRE_MAX_CONTAINMENT_PCT})`,
      `(FireDiscoveryDateTime IS NULL OR FireDiscoveryDateTime>=CURRENT_TIMESTAMP - INTERVAL '${WILDFIRE_MAX_AGE_DAYS}' DAY)`
    ].join(' AND ');

    const params = new URLSearchParams({
      where: whereClause,
      outFields: 'IncidentName,IncidentSize,PercentContained,FireDiscoveryDateTime,UniqueFireIdentifier',
      outSR: '4326',
      f: 'geojson'
    });
    const url = `https://services3.arcgis.com/T4QMspbfLg3qTGWY/arcgis/rest/services/WFIGS_Incident_Locations_Current/FeatureServer/0/query?${params}`;
    const res = await fetch(url);
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();

    return (data.features || []).map(f => {
      const p = f.properties;
      const acres = p.IncidentSize || 0;
      const contained = p.PercentContained;
      const containedText = (contained != null) ? `, ${Math.round(contained)}% contained` : '';
      return {
        id: p.UniqueFireIdentifier || f.id,
        type: 'fire',
        topCategory: 'contingency',
        title: `${p.IncidentName || 'Unnamed Fire'} - ${Math.round(acres).toLocaleString()} ac${containedText}`,
        coords: [f.geometry.coordinates[1], f.geometry.coordinates[0]],
        time: p.FireDiscoveryDateTime ? new Date(p.FireDiscoveryDateTime).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' : '',
        severity: acres >= 50000 ? 'critical' : 'warning',
        mag: acres
      };
    });
  } catch (err) {
    console.error("Failed to load WFIGS wildfire data:", err);
    return [];
  }
}

async function fetchSeismicData() {
  try {
    // 2.5+ magnitude over the last day — the old 4.5+ threshold rarely triggers for the US on any
    // given day, so real activity (which happens most often in Alaska) wasn't showing up at all.
    const res = await fetch('https://earthquake.usgs.gov/earthquakes/feed/v1.0/summary/2.5_day.geojson');
    const data = await res.json();

    // The old single bounding box only covered the Lower 48. US seismic activity is concentrated
    // in Alaska and Hawaii, so we check against multiple regions instead of one CONUS box.
    function isInUSTerritory(lat, lon) {
      const conus = lat >= 24.5 && lat <= 49.4 && lon >= -125 && lon <= -66.9;
      const alaska = lat >= 51 && lat <= 72 && (lon <= -129 || lon >= 165); // Aleutians cross the antimeridian
      const hawaii = lat >= 18 && lat <= 23 && lon >= -161 && lon <= -154;
      const puertoRico = lat >= 17 && lat <= 19 && lon >= -68 && lon <= -64;
      return conus || alaska || hawaii || puertoRico;
    }

    return data.features
      .filter(f => {
        const [lon, lat] = f.geometry.coordinates;
        return isInUSTerritory(lat, lon);
      })
      .map(f => ({
        id: f.id,
        type: 'seismic',
        topCategory: 'contingency',
        title: `M ${f.properties.mag} - ${f.properties.place}`,
        mag: f.properties.mag,
        coords: [f.geometry.coordinates[1], f.geometry.coordinates[0]],
        time: new Date(f.properties.time).toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
        severity: f.properties.mag >= 6.0 ? 'critical' : 'warning'
      }));
  } catch (err) {
    console.error("Failed to load USGS feed:", err);
    return [];
  }
}

async function fetchReliefWebDisasters() {
  try {
    const res = await fetch('https://reliefweb.int/api/v1/disasters?appname=usace-monitor&limit=50&filter[operator]=AND&filter[0][field]=status&filter[0][value]=current');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const events = [];
    if (data.data && Array.isArray(data.data)) {
      data.data.forEach(disaster => {
        const primary = disaster.fields;
        if (primary.locations && Array.isArray(primary.locations) && primary.locations.length > 0) {
          primary.locations.forEach(loc => {
            if (loc.geolocation && loc.geolocation.latitude && loc.geolocation.longitude) {
              events.push({
                id: disaster.id,
                type: 'disaster',
                topCategory: 'contingency',
                title: `${primary.name}`,
                coords: [loc.geolocation.latitude, loc.geolocation.longitude],
                time: primary.date && primary.date.created ?
                  new Date(primary.date.created).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' :
                  new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
                severity: primary.status === 'current' ? 'critical' : 'warning',
                mag: 5
              });
            }
          });
        }
      });
    }
    return events;
  } catch (err) {
    console.error("Failed to load ReliefWeb disasters:", err);
    return [];
  }
}

async function fetchNOAAAlerts() {
  try {
    const res = await fetch('https://api.weather.gov/alerts/active');
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    const events = [];
    if (data.features && Array.isArray(data.features)) {
      data.features.slice(0, 100).forEach(alert => {
        try {
          const props = alert.properties;
          if (alert.geometry && alert.geometry.coordinates && alert.geometry.coordinates.length > 0) {
            let coords;
            if (alert.geometry.type === 'Polygon') {
              const ring = alert.geometry.coordinates[0];
              coords = ring[Math.floor(ring.length / 2)];
            } else if (alert.geometry.type === 'MultiPolygon') {
              const ring = alert.geometry.coordinates[0][0];
              coords = ring[Math.floor(ring.length / 2)];
            } else {
              return;
            }
            if (coords && coords.length >= 2) {
              // NOAA's alerts feed lumps everything under one generic feed — categorize by the
              // event name so hurricanes, tropical storms, and tsunamis get their own icons
              // instead of the generic weather-alert glyph.
              const eventName = (props.event || '').toLowerCase();
              let alertType = 'weather';
              if (eventName.includes('hurricane')) alertType = 'hurricane';
              else if (eventName.includes('tropical storm')) alertType = 'tropical-storm';
              else if (eventName.includes('tsunami')) alertType = 'tsunami';
              else if (eventName.includes('flash flood') || eventName.includes('flood advisory')) alertType = 'flood-alert';
              else if (eventName.includes('severe thunderstorm')) alertType = 'severe-weather';

              events.push({
                id: alert.id,
                type: alertType,
                topCategory: 'contingency',
                title: `${props.event} - ${props.areaDesc || 'Regional'}`,
                coords: [coords[1], coords[0]],
                time: props.sent ?
                  new Date(props.sent).toISOString().replace('T', ' ').slice(0, 19) + ' UTC' :
                  new Date().toISOString().replace('T', ' ').slice(0, 19) + ' UTC',
                severity: (props.severity === 'Extreme' || props.severity === 'Severe') ? 'critical' : 'warning',
                mag: 4
              });
            }
          }
        } catch (itemErr) {
          console.warn('Error parsing NOAA alert:', itemErr);
        }
      });
    }
    return events;
  } catch (err) {
    console.error("Failed to load NOAA alerts:", err);
    return [];
  }
}

// ---- Manually-entered data feeds (Civil Works / Military Ops / Support Units / Programs) ----
// These are populated via admin.html and exported to /data/<file>.json, then committed to the repo.

const MANUAL_CATEGORIES = {
  'civil-works': { file: 'data/civil-works.json', label: 'Civil Works' },
  'support-units': { file: 'data/support-units.json', label: 'Support Units' },
  'programs': { file: 'data/military-programs.json', label: 'Military Programs' }
};

function statusToSeverity(status) {
  if (status === 'delayed') return 'critical';
  if (status === 'at-risk') return 'warning';
  if (status === 'complete') return 'good';
  return 'good'; // on-track
}

async function fetchManualCategory(catKey) {
  const cfg = MANUAL_CATEGORIES[catKey];
  try {
    const res = await fetch(cfg.file, { cache: 'no-store' });
    if (!res.ok) throw new Error(`HTTP ${res.status}`);
    const data = await res.json();
    return data.map(entry => ({
      id: entry.id,
      type: catKey,
      topCategory: catKey,
      title: entry.title,
      subcategory: entry.subcategory,
      status: entry.status,
      link: entry.link,
      details: entry.details,
      coords: (entry.lat != null && entry.lon != null) ? [entry.lat, entry.lon] : null,
      time: entry.date || '',
      severity: statusToSeverity(entry.status),
      mag: 5
    }));
  } catch (err) {
    console.warn(`No data yet for ${cfg.label} (${cfg.file}):`, err.message);
    return [];
  }
}

// ---- Rendering ----

function renderEvents(events) {
  eventMarkers.forEach(m => map.removeLayer(m));
  eventMarkers = [];

  const feedContainer = document.getElementById('events-feed');
  feedContainer.innerHTML = '';
  document.getElementById('total-events-count').innerText = `${events.length} ${topCategory === 'contingency' ? 'EVENTS' : 'ITEMS'}`;

  if (events.length === 0) {
    const cfg = MANUAL_CATEGORIES[topCategory];
    feedContainer.innerHTML = `
      <div class="empty-state">
        No entries yet for this category.<br>
        Add one via <a href="admin.html">the admin panel</a>, then export and commit
        <code>${cfg ? cfg.file : ''}</code> to the repo.
      </div>`;
    return;
  }

  events.forEach(evt => {
    const isRiverGauge = evt.type === 'river-gauge';

    // River gauges use water-specific colors (yellow=low water, blue=flood).
    // All markers now share the same compact size/border weight (previously only river
    // gauges used this smaller size — the original 32px/2px markers read as oversized).
    let iconColor, iconBgColor;
    if (isRiverGauge) {
      iconColor = evt.severity === 'critical' ? '#3aa0ff' : '#FFC000'; // flood = blue, low water = FFC000
      iconBgColor = evt.severity === 'critical' ? 'rgba(58, 160, 255, 0.2)' : 'rgba(255, 192, 0, 0.2)';
    } else if (evt.type === 'flood-alert') {
      iconColor = '#3aa0ff'; // same flood blue as flood-stage river gauges, overriding severity color
      iconBgColor = 'rgba(58, 160, 255, 0.2)';
    } else {
      iconColor = evt.severity === 'critical' ? '#ff3344' : evt.severity === 'good' ? '#00ff66' : '#ffaa00';
      iconBgColor = evt.severity === 'critical' ? 'rgba(255, 51, 68, 0.2)' : evt.severity === 'good' ? 'rgba(0, 255, 102, 0.2)' : 'rgba(255, 170, 0, 0.2)';
    }
    const iconSize = getZoomScaledIconSize();

    if (evt.coords) {
      let faIcon = 'fa-circle';
      switch (evt.type) {
        case 'seismic': faIcon = 'fa-wave-square'; break;
        case 'river-gauge': faIcon = 'fa-water'; break;
        case 'fire': faIcon = 'fa-fire'; break;
        case 'hurricane': faIcon = 'fa-wind'; break;
        case 'weather': faIcon = 'fa-cloud-bolt'; break;
        case 'flood-alert': faIcon = 'fa-water'; break;
        case 'severe-weather': faIcon = 'fa-cloud-bolt'; break;
        case 'disaster': faIcon = 'fa-triangle-exclamation'; break;
        case 'civil-works': faIcon = 'fa-diagram-project'; break;
        case 'support-units': faIcon = 'fa-people-group'; break;
        case 'programs': faIcon = 'fa-layer-group'; break;
        default: faIcon = 'fa-circle';
      }
      // Flash flood / flood advisory alerts get a thicker ring so they stand out from the
      // rest of the weather-alert markers, matching the flood-blue used elsewhere.
      const borderWidth = evt.type === 'flood-alert' ? 3 : 1;
      const fontSize = Math.round(iconSize * 0.5);
      const half = iconSize / 2;

      // Earthquakes, river gauges (flood or low-water), hurricanes, tropical storms,
      // tsunamis, and flash flood/flood advisory alerts all use custom illustrated icons
      // instead of Font Awesome glyphs. The colored ring (from iconBgColor/iconColor
      // above) still reflects severity; only the inner symbol changes.
      const isFloodGauge = isRiverGauge && evt.severity === 'critical';
      const isLowWaterGauge = isRiverGauge && evt.severity === 'warning';
      const CUSTOM_ICON_BY_TYPE = {
        'seismic': 'earthquake.png',
        'hurricane': 'hurricane.png',
        'tropical-storm': 'tropical_storm.png',
        'tsunami': 'tsunami.png',
        'flood-alert': 'flood.png',
        'fire': 'wildfire.png',
        'severe-weather': 'storm.png'
      };
      let innerHtml;
      if (CUSTOM_ICON_BY_TYPE[evt.type]) {
        const file = CUSTOM_ICON_BY_TYPE[evt.type];
        innerHtml = `<img src="assets/icons/${file}" alt="${evt.type}" style="width: ${Math.round(iconSize * 0.85)}px; height: ${Math.round(iconSize * 0.85)}px; border-radius: 50%; object-fit: cover;">`;
      } else if (isFloodGauge) {
        innerHtml = `<img src="assets/icons/flood.png" alt="Flood stage" style="width: ${Math.round(iconSize * 0.85)}px; height: ${Math.round(iconSize * 0.85)}px; border-radius: 50%; object-fit: cover;">`;
      } else if (isLowWaterGauge) {
        innerHtml = `<img src="assets/icons/drought.png" alt="Low water" style="width: ${Math.round(iconSize * 0.85)}px; height: ${Math.round(iconSize * 0.85)}px; border-radius: 50%; object-fit: cover;">`;
      } else {
        innerHtml = `<i class="fas ${faIcon}" style="color: ${iconColor}; font-size: ${fontSize}px;"></i>`;
      }

      const icon = L.divIcon({
        html: `<div style="background: ${iconBgColor}; border: ${borderWidth}px solid ${iconColor}; border-radius: 50%; width: ${iconSize}px; height: ${iconSize}px; display: flex; align-items: center; justify-content: center;">
                 ${innerHtml}
               </div>`,
        iconSize: [iconSize, iconSize], iconAnchor: [half, half], popupAnchor: [0, -half], className: 'event-icon'
      });
      const marker = L.marker(evt.coords, { icon: icon }).addTo(map);
      marker.bindPopup(`<b>${evt.title}</b><br>Type: ${evt.type}<br>Time: ${evt.time}`);
      eventMarkers.push(marker);
    }

    const card = document.createElement('div');
    const cardClass = isRiverGauge ? (evt.severity === 'critical' ? 'flood-stage' : 'low-water') : (evt.type === 'flood-alert' ? 'flood-stage' : evt.severity);
    card.className = `event-card ${cardClass}`;
    let inner = `<div><strong>${evt.title}</strong></div>`;
    if (evt.subcategory) inner += `<div class="event-subline">${evt.subcategory}</div>`;
    if (evt.details) inner += `<div class="event-details">${evt.details}</div>`;
    inner += `<div class="event-time">${evt.time}</div>`;
    if (evt.link) inner += `<a class="event-link" href="${evt.link}" target="_blank" rel="noopener">Reference &rarr;</a>`;
    card.innerHTML = inner;
    if (evt.coords) {
      card.onclick = () => {
        map.flyTo(evt.coords, 6, { duration: 1.5 });
        const marker = eventMarkers.find(m => m.getLatLng().lat === evt.coords[0] && m.getLatLng().lng === evt.coords[1]);
        if (marker) marker.openPopup();
      };
    }
    feedContainer.appendChild(card);
  });
}

// Contingency sub-layer filter state
const layerFilters = {
  'earthquakes': true, 'gauges': true, 'wildfires': false,
  'storms': false, 'weather': false, 'disasters': false
};

window.toggleAllLayers = function(enable) {
  Object.keys(layerFilters).forEach(key => {
    layerFilters[key] = enable;
    const checkbox = document.getElementById(`filter-${key}`);
    if (checkbox) checkbox.checked = enable;
  });
  updateLayerDisplay();
};

window.updateLayerDisplay = function() {
  layerFilters['earthquakes'] = document.getElementById('filter-earthquakes').checked;
  layerFilters['gauges'] = document.getElementById('filter-gauges').checked;
  layerFilters['wildfires'] = document.getElementById('filter-wildfires').checked;
  layerFilters['storms'] = document.getElementById('filter-storms').checked;
  layerFilters['weather'] = document.getElementById('filter-weather').checked;
  layerFilters['disasters'] = document.getElementById('filter-disasters').checked;
  applyCurrentFilter();
};

// ---- Top-level category switching ----

let topCategory = 'contingency';
const CATEGORY_LABELS = {
  'contingency': 'CONTINGENCY OPS',
  'civil-works': 'CIVIL WORKS',
  'support-units': 'SUPPORT UNITS',
  'programs': 'MILITARY PROGRAMS'
};

function applyCurrentFilter() {
  let filtered;
  if (topCategory === 'contingency') {
    filtered = allEvents.filter(evt => {
      if (evt.topCategory !== 'contingency') return false;
      if (evt.type === 'seismic') return layerFilters['earthquakes'];
      if (evt.type === 'river-gauge') return layerFilters['gauges'];
      if (evt.type === 'fire') return layerFilters['wildfires'];
      if (evt.type === 'hurricane' || evt.type === 'tropical-storm') return layerFilters['storms'];
      if (evt.type === 'weather' || evt.type === 'tsunami' || evt.type === 'flood-alert' || evt.type === 'severe-weather') return layerFilters['weather'];
      if (evt.type === 'disaster') return layerFilters['disasters'];
      return false;
    });
  } else {
    filtered = allEvents.filter(evt => evt.topCategory === topCategory);
  }
  renderEvents(filtered);
}

function switchTopCategory(cat) {
  topCategory = cat;
  document.querySelectorAll('.top-cat-btn').forEach(b => b.classList.toggle('active', b.dataset.cat === cat));
  document.getElementById('section-label').textContent = CATEGORY_LABELS[cat];
  document.getElementById('contingency-controls').style.display = (cat === 'contingency') ? 'block' : 'none';
  applyCurrentFilter();
}

document.querySelectorAll('.top-cat-btn').forEach(btn => {
  btn.addEventListener('click', () => switchTopCategory(btn.dataset.cat));
});

// ---- Radar UI helpers ----

async function updateRadarStatus() {
  try {
    const res = await fetch('https://api.rainviewer.com/public/weather-maps.json');
    if (!res.ok) throw new Error('network');
    const data = await res.json();
    if (data && data.radar && data.radar.past && data.radar.past.length) {
      const latest = data.radar.past[data.radar.past.length - 1].time;
      const d = new Date(latest * 1000);
      document.getElementById('radar-status').innerText = `last: ${d.toUTCString()}`;
    } else {
      document.getElementById('radar-status').innerText = 'last: N/A';
    }
  } catch (err) {
    document.getElementById('radar-status').innerText = 'last: error';
  }
}

function setRadarButtonState(enabled) {
  const btn = document.getElementById('radar-toggle');
  if (!btn) return;
  if (enabled) { btn.classList.add('active'); btn.innerText = 'RADAR ON'; }
  else { btn.classList.remove('active'); btn.innerText = 'RADAR'; }
}

function toggleRadarUI() {
  if (typeof toggleWeatherRadar !== 'function') { console.warn('radar.js not loaded'); return; }
  const btn = document.getElementById('radar-toggle');
  const enabled = btn.classList.contains('active');
  if (enabled) { removeWeatherRadar(); setRadarButtonState(false); }
  else { addWeatherRadar(); setRadarButtonState(true); updateRadarStatus(); }
}

// ---- Day/Night Terminator helpers ----

function addDayNightTerminator() {
  try {
    if (!window.L || !window.L.terminator) {
      console.error('Leaflet Terminator library not loaded');
      document.getElementById('daynight-status').innerText = 'lib error';
      return;
    }
    if (terminatorLayer) map.removeLayer(terminatorLayer);
    terminatorLayer = L.terminator({
      time: new Date(), opacity: 0.25, weight: 2, color: '#333333',
      fillColor: '#000000', fillOpacity: 0.15
    }).addTo(map);
    document.getElementById('daynight-status').innerText = 'on';
  } catch (err) {
    console.error('Failed to add day/night terminator:', err);
    document.getElementById('daynight-status').innerText = 'error: ' + err.message;
  }
}

function removeDayNightTerminator() {
  if (terminatorLayer) {
    map.removeLayer(terminatorLayer);
    terminatorLayer = null;
    document.getElementById('daynight-status').innerText = 'off';
  }
}

function toggleDayNight() {
  const btn = document.getElementById('daynight-toggle');
  const enabled = btn.classList.contains('active');
  if (enabled) {
    removeDayNightTerminator();
    btn.classList.remove('active');
    btn.innerText = 'DAY/NIGHT';
  } else {
    addDayNightTerminator();
    btn.classList.add('active');
    btn.innerText = 'DAY/NIGHT ON';
    if (!window.terminatorInterval) {
      window.terminatorInterval = setInterval(() => {
        if (terminatorLayer) addDayNightTerminator();
      }, 60000);
    }
  }
}

// ---- Initialize Feeds ----

async function init() {
  const [seismic, riverGauges, wildfires, reliefWeb, noaaAlerts, civilWorks, supportUnits, programs] = await Promise.all([
    fetchSeismicData(),
    fetchRiverGaugeData(),
    fetchWildfireData(),
    fetchReliefWebDisasters(),
    fetchNOAAAlerts(),
    fetchManualCategory('civil-works'),
    fetchManualCategory('support-units'),
    fetchManualCategory('programs')
  ]);

  allEvents = [...seismic, ...riverGauges, ...wildfires, ...reliefWeb, ...noaaAlerts, ...civilWorks, ...supportUnits, ...programs];
  applyCurrentFilter();
  document.getElementById('feed-count').innerText = 'ONLINE';

  if (typeof startRadarAutoRefresh === 'function') startRadarAutoRefresh(300000);
  updateRadarStatus();
  setInterval(updateRadarStatus, 60000);
}

init();

// Auto refresh every 2 minutes
setInterval(init, 120000);
</script>
